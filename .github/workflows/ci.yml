name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest -q

      - name: Build package
        run: uv build

  minimums:
    name: Oldest supported Python and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.10"

      # `requires-python` and every ">=" in pyproject.toml are promises. The lockfile tests
      # the newest versions; this installs the oldest ones the package says it accepts.
      - name: Install the oldest allowed version of each direct dependency
        run: |
          uv venv .venv-minimums
          uv pip install --python .venv-minimums --resolution lowest-direct -e . --group dev

      - name: Test
        run: .venv-minimums/bin/pytest -q
