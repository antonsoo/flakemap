[project]
name = "flakemap"
version = "0.3.2"
description = "Find the flaky tests in your CI history from JUnit XML reports."
dynamic = ["readme"]
license = { text = "MIT" }
authors = [{ name = "Anton Soloviev", email = "anton@praviel.com" }]
requires-python = ">=3.10"
keywords = [
    "testing",
    "ci",
    "flaky-tests",
    "junit",
    "junit-xml",
    "pytest",
    "test-reliability",
    "statistics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["rich>=13.7"]

[project.urls]
Homepage = "https://antonsoo.github.io/flakemap/"
Repository = "https://github.com/antonsoo/flakemap"
Issues = "https://github.com/antonsoo/flakemap/issues"

[project.scripts]
flakemap = "flakemap.cli:main"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

# PyPI doesn't resolve relative links, so the README's images and links are
# rewritten to absolute GitHub URLs when the package is built: images first,
# then every link that is still relative.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)\s]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/antonsoo/flakemap/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(?!https?://)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/antonsoo/flakemap/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/antonsoo/flakemap/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#|mailto:)([^"]+)"'
replacement = 'href="https://github.com/antonsoo/flakemap/blob/main/\1"'

[tool.hatch.build.targets.sdist]
include = ["/src", "/docs/*.md", "/README.md", "/CHANGELOG.md", "/LICENSE*", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/flakemap"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-randomly>=3.15",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/flakemap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# We use plain functions for tests, never classes; silence pytest trying (and
# failing) to collect flakemap's own `TestCaseResult`/`TestStats` dataclasses.
python_classes = "NoClassBasedTests"
