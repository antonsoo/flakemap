[project]
name = "flakemap"
version = "0.1.0"
description = "Find the flaky tests in your CI history from JUnit XML reports."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anton Soloviev", email = "anton@praviel.com" }]
requires-python = ">=3.10"
keywords = [
    "testing",
    "ci",
    "flaky-tests",
    "junit",
    "junit-xml",
    "pytest",
    "test-reliability",
    "statistics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["rich>=13.7"]

[project.urls]
Homepage = "https://antonsoo.github.io/flakemap/"
Repository = "https://github.com/antonsoo/flakemap"
Issues = "https://github.com/antonsoo/flakemap/issues"

[project.scripts]
flakemap = "flakemap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flakemap"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-randomly>=3.15",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/flakemap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# We use plain functions for tests, never classes; silence pytest trying (and
# failing) to collect flakemap's own `TestCaseResult`/`TestStats` dataclasses.
python_classes = "NoClassBasedTests"
